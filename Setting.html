<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Настройки</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="menu.css">
<script>try{var _p=localStorage.getItem("ce_palette");if(_p)document.documentElement.setAttribute("data-palette",_p)}catch(e){}try{var _f=localStorage.getItem("ce_font"),_z=localStorage.getItem("ce_size");if(_f&&_f!=="sys")document.documentElement.setAttribute("data-font",_f);if(_z&&_z!=="m")document.documentElement.setAttribute("data-size",_z)}catch(e){}</script>
</head><body data-page="settings"><div class="app">
<div class="tbar" id="tbar"><button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="tbl">Настройки</div></div>
<h2 class="rh">Оформление</h2>
<div class="themebar"><button id="thbtn" hidden></button><div class="chips" id="thpanel"></div><div class="chips" id="fspanel"></div></div>
<h2 class="rh">Пример</h2>
<div class="rule"><b>Заголовок карточки</b><p>Обычный текст страницы: так выглядит основной текст.</p><p class="m">Приглушённый текст: подписи и пояснения.</p><p class="ex">Текст-акцент: примеры и выделения.</p></div>
<div class="chips" style="margin:12px 0"><button class="chip" aria-pressed="false">Кнопка</button><button class="chip" aria-pressed="true">Выбрано</button></div>
<button class="go wide" type="button">Главная кнопка</button>
<div class="note" style="margin-top:14px">Выбор сохраняется в браузере и применяется на всех страницах.</div>
</div>
<script>(function(){(function(){
var P=[["sky", "Голубая", "l", "#EEF2F8", "#2F5BEA"], ["mint", "Мята", "l", "#EAF5F0", "#1E8E6E"], ["lav", "Лаванда", "l", "#F2EFFA", "#6C4DD8"], ["sand", "Песок", "l", "#F7F2E8", "#9A4A1B"], ["night", "Ночь", "d", "#0E1626", "#7FA2FF"], ["graphite", "Графит", "d", "#141414", "#8AB4F8"], ["forest", "Лес", "d", "#0F1A16", "#5ED2A6"], ["plum", "Слива", "d", "#1A1226", "#B79CFF"], ["amoled", "AMOLED", "d", "#000000", "#7FA2FF"],["neon", "Neon Green", "n", "#0B0B0B", "#39FF14"], ["crimson", "Crimson", "n", "#1A1A1A", "#C81E4D"], ["elpurple", "Electric Purple", "n", "#00120B", "#C200FB"], ["magteal", "Magenta × Teal", "n", "#0B0614", "#FF00FF"], ["limeberry", "Lime × Berry", "n", "#12060E", "#22FF7B"], ["pinkacid", "Pink × Acid", "n", "#100A0D", "#9EFF00"],["crimart","Lilith","c","#1A1A1A","#D92B5C"]],KEY="ce_palette",cur="auto";
try{cur=localStorage.getItem(KEY)||"auto"}catch(e){}
var panel=document.getElementById("thpanel"),btn=document.getElementById("thbtn");
function chip(id,name,bg,ac){return '<button class="chip" data-p="'+id+'" aria-pressed="'+(cur===id)+'">'+(bg?'<i class="sw" style="background:'+bg+';border-color:'+ac+'"></i>':"")+name+"</button>"}
function ui(){panel.innerHTML='<div class="tgrp">Авто</div>'+chip("auto","По системе")+'<div class="tgrp">Светлые</div>'+P.filter(function(p){return p[2]==="l"}).map(function(p){return chip(p[0],p[1],p[3],p[4])}).join("")+'<div class="tgrp">Тёмные</div>'+P.filter(function(p){return p[2]==="d"}).map(function(p){return chip(p[0],p[1],p[3],p[4])}).join("")+'<div class="tgrp">Неон</div>'+P.filter(function(p){return p[2]==="n"}).map(function(p){return chip(p[0],p[1],p[3],p[4])}).join("")+'<div class="tgrp">Кастомные</div>'+P.filter(function(p){return p[2]==="c"}).map(function(p){return chip(p[0],p[1],p[3],p[4])}).join("")}
function apply(id){cur=id;var r=document.documentElement;if(id==="auto")r.removeAttribute("data-palette");else r.setAttribute("data-palette",id);try{localStorage.setItem(KEY,id)}catch(e){}ui()}
panel.onclick=function(e){var b=e.target.closest(".chip");if(b)apply(b.getAttribute("data-p"))};
btn.onclick=function(){panel.hidden=!panel.hidden;document.getElementById("fspanel").hidden=panel.hidden;btn.setAttribute("aria-expanded",String(!panel.hidden))};
ui();
})();})();</script>
<script>(function(){(function(){
var F=[["sys","Системный"],["serif","С засечками"],["mono","Моно"],["kurale","Kurale"],["goth","Готика"]],S=[["s","A−"],["m","A"],["l","A+"],["xl","A++"]],f="sys",z="m";
try{f=localStorage.getItem("ce_font")||"sys";z=localStorage.getItem("ce_size")||"m"}catch(e){}
var el=document.getElementById("fspanel");
function ui(){el.innerHTML='<div class="tgrp">Шрифт</div>'+F.map(function(x){return '<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>'}).join("")+'<div class="tgrp">Размер</div>'+S.map(function(x){return '<button class="chip" data-z="'+x[0]+'" aria-pressed="'+(z===x[0])+'">'+x[1]+'</button>'}).join("")}
function apply(){var r=document.documentElement;if(f==="sys")r.removeAttribute("data-font");else r.setAttribute("data-font",f);if(z==="m")r.removeAttribute("data-size");else r.setAttribute("data-size",z);try{localStorage.setItem("ce_font",f);localStorage.setItem("ce_size",z)}catch(e){}ui()}
el.onclick=function(e){var b=e.target.closest(".chip");if(!b)return;if(b.getAttribute("data-f"))f=b.getAttribute("data-f");else z=b.getAttribute("data-z");apply()};
ui();
})();})();</script>
<script>
/* Меню слева для страниц «Настройки» и «История изменений».
   Пункты английского открывают English(beta).html сразу нужным разделом (#раздел:режим).
   Названия заданий дублируют те, что в English(beta).html. */
(function(){
  var TARGET="English(beta).html";
  var PAGE=document.body.getAttribute("data-page")||"";
  var EN=[
    {sec:"vocab",name:"Лексика",root:"words",subs:[["cards","Карточки"],["form","Форма слова"],["gapopt","Вставь слово"],["gap","Впиши слово"],["odd","Лишнее"]]},
    {sec:"gram",name:"Грамматика",root:"rules",subs:[["tense","Времена"],["passive","Актив → пассив"],["choice","Выбери форму"],["err","Найди ошибку"]]}
  ];
  function a(href,text,cls,cur){return '<a class="di'+(cls?" "+cls:"")+'" href="'+href+'"'+(cur?' aria-current="true"':'')+'>'+text+'</a>'}
  var h='<div class="dh"><span>Меню</span><button class="dx" id="dclose" aria-label="Закрыть меню">✕</button></div><nav class="dn" aria-label="Разделы">'
   +'<div class="dg">Общее</div>'
   +a("Setting.html","Настройки","",PAGE==="settings")
   +a("Changelog.html","История изменений","",PAGE==="changelog")
   +'<div class="dg">Английский</div>';
  EN.forEach(function(g){
    h+='<div class="dr">'+a(TARGET+"#"+g.sec+":"+g.root,g.name)
      +'<button class="dt" data-tog="'+g.sec+'" aria-expanded="false" aria-controls="ds-'+g.sec+'" aria-label="Задания: '+g.name+'">▾</button></div>'
      +'<div class="ds" id="ds-'+g.sec+'" hidden>';
    g.subs.forEach(function(s){h+=a(TARGET+"#"+g.sec+":"+s[0],s[1],"sub")});
    h+='</div>';
  });
  h+=a(TARGET+"#plan:","План")+'</nav>';
  var scrim=document.createElement("div");scrim.className="scrim";
  var dr=document.createElement("aside");dr.className="drawer";dr.id="drawer";dr.setAttribute("role","dialog");dr.setAttribute("aria-modal","true");dr.setAttribute("aria-label","Меню");dr.setAttribute("aria-hidden","true");dr.innerHTML=h;
  document.body.insertBefore(dr,document.body.firstChild);document.body.insertBefore(scrim,dr);
  var bu=document.getElementById("burger"),isOpen=false,back=null;
  function toggle(sec){var box=document.getElementById("ds-"+sec),t=dr.querySelector('[data-tog="'+sec+'"]'),show=box.hidden;box.hidden=!show;t.setAttribute("aria-expanded",String(show));t.textContent=show?"▴":"▾"}
  function openM(){if(isOpen)return;isOpen=true;back=document.activeElement;dr.classList.add("open");scrim.classList.add("open");dr.setAttribute("aria-hidden","false");bu.setAttribute("aria-expanded","true");document.body.classList.add("nosc");document.getElementById("dclose").focus()}
  function closeM(){if(!isOpen)return;isOpen=false;dr.classList.remove("open");scrim.classList.remove("open");dr.setAttribute("aria-hidden","true");bu.setAttribute("aria-expanded","false");document.body.classList.remove("nosc");if(back&&back.focus)back.focus({preventScroll:true})}
  bu.onclick=function(){isOpen?closeM():openM()};
  document.getElementById("dclose").onclick=closeM;scrim.onclick=closeM;
  dr.onclick=function(e){var t=e.target.closest("[data-tog]");if(t)toggle(t.getAttribute("data-tog"))};
  document.addEventListener("keydown",function(e){
    if(!isOpen)return;
    if(e.key==="Escape"){e.preventDefault();closeM();return}
    if(e.key!=="Tab")return;
    var f=Array.prototype.filter.call(dr.querySelectorAll("a[href],button"),function(x){return x.offsetParent!==null});
    if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });
})();
</script>
</body></html>
